<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Tech Store NP</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="navbar admin-navbar">
    <h2>Tech Store NP — Admin Panel</h2>
    <a href="index.html" class="nav-btn">View Website</a>
  </header>

  <main class="container admin-container">
    <!-- Section 1: Add New Product -->
    <section class="admin-card">
      <h3>Add New Product</h3>
      <form id="addProductForm" onsubmit="handleAddProduct(event)" class="admin-form">
        <div class="form-row">
          <input type="text" id="pTitle" placeholder="Product Title" required />
          <input type="text" id="pBrand" placeholder="Brand (e.g. HP, Lenovo)" required />
        </div>
        <div class="form-row">
          <input type="number" id="pPrice" placeholder="Price (NPR)" required />
          <input type="number" id="pOldPrice" placeholder="Old Price (Optional)" />
        </div>
        <div class="form-row">
          <input type="text" id="pCategory" placeholder="Category" required />
          <input type="url" id="pImage" placeholder="Image URL" required />
        </div>
        <textarea id="pDesc" placeholder="Description"></textarea>
        <button type="submit" class="btn-primary">Add Product</button>
      </form>
    </section>

    <!-- Section 2: Manage Products -->
    <section class="admin-card">
      <h3>Manage Products</h3>
      <table class="data-table">
        <thead>
          <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Price</th>
            <th>Brand</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminProductsTable">
          <tr><td colspan="5">Loading products...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Section 3: Live Orders -->
    <section class="admin-card">
      <h3>Recent Orders</h3>
      <table class="data-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminOrdersTable">
          <tr><td colspan="6">Loading orders...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="shared.js"></script>
  <script>
    async function fetchAdminData() {
      loadAdminProducts();
      loadAdminOrders();
    }

    async function loadAdminProducts() {
      const tbody = document.getElementById('adminProductsTable');
      const { data, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="5">Error loading products</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(p => `
        <tr>
          <td><img src="${p.image}" width="40" height="40" style="object-fit:cover; border-radius:4px;" /></td>
          <td>${p.title}</td>
          <td>Rs. ${p.price.toLocaleString()}</td>
          <td>${p.brand || '-'}</td>
          <td>
            <button onclick="deleteProduct('${p.id}')" class="btn-danger">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function handleAddProduct(e) {
      e.preventDefault();

      const newProduct = {
        title: document.getElementById('pTitle').value,
        brand: document.getElementById('pBrand').value,
        price: parseFloat(document.getElementById('pPrice').value),
        old_price: document.getElementById('pOldPrice').value ? parseFloat(document.getElementById('pOldPrice').value) : null,
        category: document.getElementById('pCategory').value,
        image: document.getElementById('pImage').value,
        description: document.getElementById('pDesc').value,
      };

      const { error } = await supabaseClient.from('products').insert([newProduct]);

      if (error) {
        alert("Error adding product: " + error.message);
      } else {
        alert("Product added successfully!");
        document.getElementById('addProductForm').reset();
        loadAdminProducts();
      }
    }

    async function deleteProduct(id) {
      if (!confirm("Are you sure you want to delete this product?")) return;

      const { error } = await supabaseClient.from('products').delete().eq('id', id);
      if (error) {
        alert("Failed to delete: " + error.message);
      } else {
        loadAdminProducts();
      }
    }

    async function loadAdminOrders() {
      const tbody = document.getElementById('adminOrdersTable');
      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6">Error loading orders</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(o => `
        <tr>
          <td>${o.customer_name}</td>
          <td>${o.customer_phone}</td>
          <td>${o.customer_address}, ${o.city}</td>
          <td>Rs. ${o.total_amount.toLocaleString()}</td>
          <td><span class="badge">${o.order_status}</span></td>
          <td>
            <select onchange="updateOrderStatus('${o.id}', this.value)">
              <option value="Order Placed" ${o.order_status === 'Order Placed' ? 'selected' : ''}>Order Placed</option>
              <option value="Confirmed" ${o.order_status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
              <option value="Shipped" ${o.order_status === 'Shipped' ? 'selected' : ''}>Shipped</option>
              <option value="Delivered" ${o.order_status === 'Delivered' ? 'selected' : ''}>Delivered</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    async function updateOrderStatus(orderId, newStatus) {
      const { error } = await supabaseClient
        .from('orders')
        .update({ order_status: newStatus })
        .eq('id', orderId);

      if (error) alert("Failed to update status: " + error.message);
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchAdminData();
      setupRealtimeSubscriptions(
        () => loadAdminProducts(),
        () => loadAdminOrders()
      );
    });
  </script>
</body>
</html>
