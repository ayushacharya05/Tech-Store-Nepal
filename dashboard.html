<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Nepal | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.active-tab { border-bottom: 2px solid #2563eb; color: #2563eb; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- ADMIN LOGIN GATE -->
    <div id="login-gate" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <i class="fa-solid fa-bolt text-blue-600 text-3xl mb-2"></i>
                <h1 class="text-xl font-bold text-gray-900">TechStore NP Admin</h1>
                <p class="text-sm text-gray-500">Sign in to manage the store</p>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-gray-600 block mb-1">Username</label>
                    <input type="text" id="admin-input-user" required placeholder="admin" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600 block mb-1">Password</label>
                    <input type="password" id="admin-input-pass" required placeholder="••••••••" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm">Access Dashboard</button>
            </form>
            <p class="text-[11px] text-gray-400 mt-4 text-center">Default login: <b>ayushacharya</b> / <b>Ayush@2059</b></p>
            <a href="index.html" class="block text-center text-xs text-gray-400 hover:text-blue-600 mt-3">← Back to store</a>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Admin Dashboard</h1>
                <p class="text-sm text-gray-500">Manage orders, products, categories, and delivery rates.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="handleAdminLogout()" class="text-sm bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-lg font-medium">Logout</button>
                <a href="index.html" class="text-sm bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg">View Store</a>
            </div>
        </div>

        <div id="sync-status" class="text-xs text-gray-400 mb-4"></div>

        <div class="flex gap-2 mb-6 border-b text-sm font-semibold">
            <button id="tab-orders" onclick="switchTab('orders')" class="px-4 py-2 active-tab">Orders</button>
            <button id="tab-products" onclick="switchTab('products')" class="px-4 py-2 text-gray-500">Products</button>
            <button id="tab-categories" onclick="switchTab('categories')" class="px-4 py-2 text-gray-500">Categories</button>
            <button id="tab-delivery" onclick="switchTab('delivery')" class="px-4 py-2 text-gray-500">Delivery Rates</button>
        </div>

        <!-- ORDERS PANEL -->
        <div id="panel-orders">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-boxes-packing text-blue-600"></i> Manage Customer Orders</h2>
                <div id="admin-orders-list" class="space-y-4"></div>
            </div>
        </div>

        <!-- PRODUCTS PANEL -->
        <div id="panel-products" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
                <h2 id="product-form-title" class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-plus text-blue-600"></i> Add New Product</h2>
                <form id="product-form" onsubmit="handleSaveProduct(event)" class="space-y-4">
                    <input type="hidden" id="p-id">
                    <div>
                        <label class="text-xs font-semibold text-gray-600 block mb-1">Product Title</label>
                        <textarea id="p-title" required rows="2" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600 block mb-1">Category</label>
                        <select id="p-category" class="w-full border rounded-lg p-2.5 text-sm outline-none"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-semibold text-gray-600 block mb-1">Price (NPR)</label>
                            <input type="number" id="p-price" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-600 block mb-1">Original Price</label>
                            <input type="number" id="p-oldprice" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600 block mb-1">Image URL</label>
                        <input type="url" id="p-image" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                    </div>
                    <button type="submit" id="save-product-btn" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg text-sm hover:bg-blue-700">Save Product</button>
                </form>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold mb-4">Active Catalog Items</h2>
                    <div id="admin-product-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- CATEGORIES PANEL -->
        <div id="panel-categories" class="hidden max-w-xl">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-tags text-blue-600"></i> Categories</h2>
                <div id="category-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- DELIVERY PANEL -->
        <div id="panel-delivery" class="hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-truck-ram text-blue-600"></i> Delivery Rates</h2>
                <div id="delivery-rate-table"></div>
            </div>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="shared.js"></script>
    <script>
        const DEFAULT_ADMIN = { username: 'ayushacharya', password: 'Ayush@2059' };
        let products = [], categories = [], deliveryRates = [], orders = [];

        function handleAdminLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-input-user').value.trim() === DEFAULT_ADMIN.username &&
                document.getElementById('admin-input-pass').value.trim() === DEFAULT_ADMIN.password) {
                document.getElementById('login-gate').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                initDashboard();
            } else alert('Invalid Admin Credentials.');
        }

        function handleAdminLogout() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-gate').classList.remove('hidden');
        }

        async function initDashboard() {
            await ensureSeeded();
            switchTab('orders');
            subscribeProducts(list => { products = list; renderAdminProducts(); });
            subscribeCategories(list => { categories = list; });
            subscribeDelivery(list => { deliveryRates = list; });
            subscribeOrders(list => { orders = list; renderAdminOrders(); });
        }

        function switchTab(tab) {
            ['orders', 'products', 'categories', 'delivery'].forEach(t => {
                document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`tab-${t}`).classList.toggle('active-tab', t === tab);
                document.getElementById(`tab-${t}`).classList.toggle('text-gray-500', t !== tab);
            });
        }

        function renderAdminOrders() {
            const container = document.getElementById('admin-orders-list');
            if (orders.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400 py-4">No customer orders placed yet.</p>`;
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="border rounded-xl p-4 bg-gray-50 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <p class="text-xs font-bold text-gray-900">Order ID: <span class="text-blue-600">${o.order_id}</span></p>
                        <p class="text-xs font-semibold text-gray-700">${o.name} (${o.phone})</p>
                        <p class="text-xs text-gray-500">${o.email} | ${o.address}, ${o.delivery_location}</p>
                        <p class="text-xs text-gray-400 mt-1">Payment Method: <b>${o.payment_method}</b> ${o.transaction_id ? `(Txn: ${o.transaction_id})` : ''}</p>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-gray-800">Items:</p>
                        <div class="text-xs text-gray-600 whitespace-pre-line">${o.items}</div>
                        <p class="text-xs font-bold text-gray-900 mt-1">Total: NPR ${o.total}</p>
                    </div>
                    <div class="space-y-3 bg-white p-3 border rounded-lg">
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 block uppercase">Tracking Status</label>
                            <select onchange="updateStatus('${o.id}', this.value, null)" class="w-full border rounded p-1.5 text-xs outline-none bg-gray-50">
                                <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>Processing</option>
                                <option value="product packed" ${o.status === 'product packed' ? 'selected' : ''}>Product Packed</option>
                                <option value="product shipped" ${o.status === 'product shipped' ? 'selected' : ''}>Product Shipped</option>
                                <option value="nearby location" ${o.status === 'nearby location' ? 'selected' : ''}>Near By Our Location</option>
                                <option value="product delivered" ${o.status === 'product delivered' ? 'selected' : ''}>Product Delivered</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 block uppercase">Payment Status</label>
                            <select onchange="updateStatus('${o.id}', null, this.value)" class="w-full border rounded p-1.5 text-xs outline-none bg-gray-50">
                                <option value="payment processing" ${o.payment_status === 'payment processing' ? 'selected' : ''}>Payment Processing</option>
                                <option value="payment received" ${o.payment_status === 'payment received' ? 'selected' : ''}>Payment Received</option>
                            </select>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(orderId, status, payment_status) {
            try {
                await updateOrderStatusDoc(orderId, status, payment_status);
            } catch (err) {
                alert('Could not update status');
            }
        }

        function renderAdminProducts() {
            const list = document.getElementById('admin-product-list');
            list.innerHTML = products.map(p => `
                <div class="flex items-center justify-between p-3 border rounded-lg bg-gray-50 text-xs">
                    <div class="flex items-center gap-3">
                        <img src="${p.image}" class="w-10 h-10 rounded object-cover">
                        <div>
                            <p class="font-bold text-gray-800">${p.title}</p>
                            <span class="text-gray-500 uppercase">NPR ${p.price}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
