<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-6 bg-gray-100">
    <h1 class="text-2xl font-bold mb-6">Manage Products</h1>
    
    <div class="bg-white p-6 rounded shadow mb-6">
        <input id="p-id" type="hidden">
        <input id="p-title" placeholder="Title" class="border p-2 w-full mb-2">
        <input id="p-price" type="number" placeholder="Price" class="border p-2 w-full mb-2">
        <input id="p-image" placeholder="Image URL" class="border p-2 w-full mb-2">
        <button onclick="save()" class="bg-blue-600 text-white px-4 py-2 rounded">Save Product</button>
    </div>

    <div id="list" class="bg-white p-6 rounded shadow"></div>

    <script src="shared.js"></script>
    <script>
        async function save() {
            const product = {
                id: document.getElementById('p-id').value || 'p_' + Date.now(),
                title: document.getElementById('p-title').value,
                price: parseFloat(document.getElementById('p-price').value),
                image: document.getElementById('p-image').value
            };
            await saveProductData(product);
            alert('Saved!');
        }

        subscribeProducts(data => {
            document.getElementById('list').innerHTML = data.map(p => `
                <div class="flex justify-between border-b py-2">
                    ${p.title} - NPR ${p.price}
                    <button onclick="deleteProductData('${p.id}')" class="text-red-500">Delete</button>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
