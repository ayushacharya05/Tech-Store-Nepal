<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore NP | Shop Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white p-4 shadow-sm flex justify-between items-center">
        <h1 class="font-bold text-xl text-blue-600">TechStore NP</h1>
        <a href="dashboard.html" class="text-xs text-gray-500 hover:text-blue-600">Admin Login</a>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Products will inject here -->
        </div>
    </main>

    <script src="shared.js"></script>
    <script>
        const grid = document.getElementById('product-grid');
        
        async function loadStore() {
            // Use the subscriber from shared.js
            subscribeProducts((products) => {
                grid.innerHTML = products.map(p => `
                    <div class="bg-white p-4 rounded-lg shadow-sm border">
                        <img src="${p.image}" class="w-full h-40 object-cover rounded mb-2">
                        <h2 class="font-bold text-sm line-clamp-1">${p.title}</h2>
                        <p class="text-blue-600 font-bold">NPR ${p.price}</p>
                    </div>
                `).join('');
            });
        }
        loadStore();
    </_script>
</body>
</html>
