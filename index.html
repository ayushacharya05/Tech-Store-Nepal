<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tech Store NP</title>
  
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Embedded All-In-One CSS -->
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
    }

    /* CRITICAL: Hides modals & hidden elements */
    .hidden {
      display: none !important;
    }

    /* Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1d20;
      color: #fff;
      padding: 15px 30px;
    }

    .logo a {
      color: #fff;
      text-decoration: none;
    }

    .logo span {
      color: #007bff;
    }

    .search-bar input {
      padding: 8px 15px;
      width: 300px;
      border-radius: 20px;
      border: 1px solid #444;
      outline: none;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .nav-btn:hover {
      background: #0056b3;
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #007bff, #6610f2);
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    /* Main Layout */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .product-card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    .product-card h3 {
      font-size: 1.1rem;
      margin: 10px 0 5px;
    }

    .brand {
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .price-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }

    .price {
      font-weight: bold;
      font-size: 1.2rem;
      color: #28a745;
    }

    .old-price {
      text-decoration: line-through;
      color: #888;
      font-size: 0.9rem;
    }

    .btn-primary, .btn-secondary {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #007bff;
      color: #fff;
    }

    .btn-secondary {
      background: #28a745;
      color: #fff;
    }

    .btn-primary:hover { background: #0056b3; }
    .btn-secondary:hover { background: #218838; }

    /* Modals Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    .input-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 0.9rem;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .input-group input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .auth-toggle {
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
    }

    /* Cart Slide-out Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 350px;
      height: 100vh;
      background: #fff;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
      transition: right 0.3s ease;
      z-index: 999;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 20px;
      background: #1a1d20;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .cart-item img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-details h4 {
      font-size: 0.95rem;
    }

    .cart-item-details p {
      font-size: 0.85rem;
      color: #666;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #dc3545;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .drawer-footer {
      padding: 20px;
      border-top: 1px solid #eee;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="logo">
      <a href="index.html"><h2>Tech Store <span>NP</span></h2></a>
    </div>
    
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterProducts()" />
    </div>

    <div class="nav-actions">
      <button id="userAuthBtn" class="nav-btn">Account</button>
      <button id="cartBtn" class="nav-btn" onclick="openCartDrawer()">
        Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to Tech Store NP</h1>
    <p>Find the best laptops, accessories, and tech gadgets in Biratnagar!</p>
  </section>

  <!-- Main Product Showcase -->
  <main class="container">
    <h2>Featured Products</h2>
    <div id="productGrid" class="product-grid">
      <p class="loading">Loading products...</p>
    </div>
  </main>

  <!-- Cart Slide-out Drawer -->
  <div id="cartDrawer" class="cart-drawer">
    <div class="drawer-header">
      <h3>Your Cart</h3>
      <button onclick="closeCartDrawer()" class="close-btn" style="color: white;">&times;</button>
    </div>
    <div id="cartItems" class="drawer-body"></div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Total:</span>
        <strong id="cartTotal">Rs. 0</strong>
      </div>
      <button class="btn-primary" onclick="openCheckoutModal()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Auth / Login Modal (Email & Password) -->
  <div id="authModal" class="modal-overlay hidden">
    <div class="modal-card">
      <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      <h2 id="authTitle" style="margin-bottom: 15px;">Sign In</h2>
      
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="input-group">
          <label for="authEmail">Email Address</label>
          <input type="email" id="authEmail" placeholder="name@example.com" required />
        </div>
        
        <div class="input-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-primary" id="authSubmitBtn">Sign In</button>
      </form>

      <p class="auth-toggle">
        <span id="authToggleText">Don't have an account?</span> 
        <a href="#" onclick="toggleAuthMode(event)" id="authToggleLink">Sign Up</a>
      </p>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="modal-overlay hidden">
    <div class="modal-card">
      <button class="close-btn" onclick="closeCheckoutModal()">&times;</button>
      <h2 style="margin-bottom: 15px;">Checkout</h2>
      <form id="checkoutForm" onsubmit="handleCheckout(event)">
        <div class="input-group">
          <label for="custName">Full Name</label>
          <input type="text" id="custName" required />
        </div>
        <div class="input-group">
          <label for="custPhone">Phone Number</label>
          <input type="tel" id="custPhone" required />
        </div>
        <div class="input-group">
          <label for="custAddress">Delivery Address</label>
          <input type="text" id="custAddress" required />
        </div>
        <div class="input-group">
          <label for="custCity">City</label>
          <input type="text" id="custCity" value="Biratnagar" required />
        </div>
        <button type="submit" class="btn-primary">Place Order (Cash on Delivery)</button>
      </form>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="shared.js"></script>
  <script>
    let allProducts = [];

    async function loadProducts() {
      const grid = document.getElementById('productGrid');
      const { data, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = `<p class="error">Error loading products.</p>`;
        return;
      }

      allProducts = data || [];
      renderProducts(allProducts);
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      if (products.length === 0) {
        grid.innerHTML = `<p>No products available right now.</p>`;
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.image || 'https://via.placeholder.com/200'}" alt="${p.title}" />
          <h3>${p.title}</h3>
          <p class="brand">${p.brand || ''}</p>
          <div class="price-row">
            <span class="price">Rs. ${p.price.toLocaleString()}</span>
            ${p.old_price ? `<span class="old-price">Rs. ${p.old_price.toLocaleString()}</span>` : ''}
          </div>
          <button onclick='addToCart(${JSON.stringify(p)})' class="btn-secondary">Add to Cart</button>
        </div>
      `).join('');
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => p.title.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    function openCheckoutModal() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      closeCartDrawer();
      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    async function handleCheckout(e) {
      e.preventDefault();

      const orderData = {
        customer_name: document.getElementById('custName').value,
        customer_phone: document.getElementById('custPhone').value,
        customer_address: document.getElementById('custAddress').value,
        city: document.getElementById('custCity').value,
        items: cart,
        total_amount: cart.reduce((sum, i) => sum + (i.price * i.quantity), 0),
        payment_method: 'cod',
        payment_status: 'pending',
        order_status: 'Order Placed'
      };

      const { data, error } = await supabaseClient.from('orders').insert([orderData]);

      if (error) {
        alert("Failed to place order: " + error.message);
      } else {
        alert("Order placed successfully!");
        cart = [];
        updateCartUI();
        closeCheckoutModal();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
      setupRealtimeSubscriptions(() => loadProducts());
    });
  </script>
</body>
</html>
